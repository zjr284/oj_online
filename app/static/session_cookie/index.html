<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>session cookie</title></head>
<body style="margin:0;height:0;overflow:hidden">
<script>
// 与后端的 HttpOnly oj_session 分开，避免同名 Cookie 无法被 JS
// 回读时误判为浏览器拒绝保存。
const COOKIE_NAME = "oj_browser_session";
const LEGACY_COOKIE_NAME = "oj_session";

function notifyReady() {
  window.parent.postMessage({
    isStreamlitMessage: true,
    type: "streamlit:componentReady",
    apiVersion: 1
  }, "*");
}

function setHeight() {
  window.parent.postMessage({
    isStreamlitMessage: true,
    type: "streamlit:setFrameHeight",
    height: 0
  }, "*");
}

function cookieValue(cookieDocument, name) {
  const prefix = `${name}=`;
  const item = cookieDocument.cookie.split("; ").find(row => row.startsWith(prefix));
  return item ? item.slice(prefix.length) : null;
}

function notifyCookieChanged(present, marker) {
  // Cookie 首次写入后让 Streamlit 再跑一次，确保用户来得及点击导航
  // 或刷新之前，持久化已经完成。通知中不包含会话令牌。
  window.parent.postMessage({
    isStreamlitMessage: true,
    type: "streamlit:setComponentValue",
    dataType: "json",
    value: {present, marker}
  }, "*");
}

window.addEventListener("message", (event) => {
  if (!event.data || event.data.type !== "streamlit:render") return;
  const args = event.data.args || {};
  const secure = window.location.protocol === "https:" ? "; Secure" : "";
  let cookieDocument = document;
  try {
    // 组件与 Streamlit 同源时直接写父页文档，确保 /ai 等原生页面刷新时可读。
    cookieDocument = window.parent.document;
  } catch (_) {}
  const current = cookieValue(cookieDocument, COOKIE_NAME);
  const legacyCurrent = cookieValue(cookieDocument, LEGACY_COOKIE_NAME);
  if (args.token) {
    const encoded = encodeURIComponent(args.token);
    if (current !== encoded) {
      cookieDocument.cookie = `${COOKIE_NAME}=${encoded}; Path=/; Max-Age=${Number(args.max_age) || 0}; SameSite=Lax${secure}`;
    }
    // Streamlit 原生页面切换会重新挂载组件，但 Cookie 此时通常已经存在。
    // 每次挂载都回报当前状态，否则新页面拿到 default=None 后会永久停在
    // “正在安全保存登录状态…”。组件值稳定后 Streamlit 不会重复触发 rerun。
    notifyCookieChanged(cookieValue(cookieDocument, COOKIE_NAME) === encoded, args.marker || "");
  } else if (args.clear && (current !== null || legacyCurrent !== null)) {
    if (current !== null) {
      cookieDocument.cookie = `${COOKIE_NAME}=; Path=/; Max-Age=0; SameSite=Lax${secure}`;
    }
    if (legacyCurrent !== null) {
      cookieDocument.cookie = `${LEGACY_COOKIE_NAME}=; Path=/; Max-Age=0; SameSite=Lax${secure}`;
    }
    notifyCookieChanged(false, "");
  }
  setHeight();
});

notifyReady();
setHeight();
</script>
</body>
</html>

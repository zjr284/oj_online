<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>session cookie</title></head>
<body style="margin:0;height:0;overflow:hidden">
<script>
const COOKIE_NAME = "oj_session";

function notifyReady() {
  window.parent.postMessage({
    isStreamlitMessage: true,
    type: "streamlit:componentReady",
    apiVersion: 1
  }, "*");
}

function setHeight() {
  window.parent.postMessage({
    isStreamlitMessage: true,
    type: "streamlit:setFrameHeight",
    height: 0
  }, "*");
}

window.addEventListener("message", (event) => {
  if (!event.data || event.data.type !== "streamlit:render") return;
  const args = event.data.args || {};
  const secure = window.location.protocol === "https:" ? "; Secure" : "";
  if (args.token) {
    document.cookie = `${COOKIE_NAME}=${encodeURIComponent(args.token)}; Path=/; Max-Age=${Number(args.max_age) || 0}; SameSite=Strict${secure}`;
  } else {
    document.cookie = `${COOKIE_NAME}=; Path=/; Max-Age=0; SameSite=Strict${secure}`;
  }
  setHeight();
});

notifyReady();
setHeight();
</script>
</body>
</html>
